name: Tests

# Quick tests on every push and pull request. Building the installer and the release is separate (release.yml, on a v* tag).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt pytest

      - name: Tests
        run: python -m pytest tests -q
